<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="900" height="160" fill="url(#bgGrad)" rx="14"/>

  <!-- connecting lines between nodes -->
  <g stroke="url(#lineGrad)" stroke-width="1.6" fill="none">
    <path id="path1" d="M 60 80 L 220 40 L 380 100 L 540 50 L 700 90 L 840 60"/>
    <path d="M 220 40 L 220 120 L 380 100"/>
    <path d="M 540 50 L 540 130 L 700 90"/>
  </g>

  <!-- static nodes -->
  <g>
    <circle cx="60" cy="80" r="5" fill="#e2e8f0"/>
    <circle cx="220" cy="40" r="6" fill="#22d3ee"/>
    <circle cx="220" cy="120" r="5" fill="#e2e8f0"/>
    <circle cx="380" cy="100" r="7" fill="#818cf8"/>
    <circle cx="540" cy="50" r="6" fill="#22d3ee"/>
    <circle cx="540" cy="130" r="5" fill="#e2e8f0"/>
    <circle cx="700" cy="90" r="6" fill="#818cf8"/>
    <circle cx="840" cy="60" r="5" fill="#e2e8f0"/>
  </g>

  <!-- pulsing glow on the two main hub nodes -->
  <circle cx="380" cy="100" r="7" fill="none" stroke="#818cf8" stroke-width="2">
    <animate attributeName="r" values="7;18;7" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="90" r="6" fill="none" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="r" values="6;16;6" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- animated "data packets" traveling along the main path -->
  <circle r="4" fill="#67e8f9">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 60 80 L 220 40 L 380 100 L 540 50 L 700 90 L 840 60"/>
  </circle>
  <circle r="4" fill="#a78bfa">
    <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M 60 80 L 220 40 L 380 100 L 540 50 L 700 90 L 840 60"/>
  </circle>
  <circle r="4" fill="#67e8f9">
    <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite" path="M 60 80 L 220 40 L 380 100 L 540 50 L 700 90 L 840 60"/>
  </circle>

  <!-- centered label -->
  <text x="450" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace"
        font-size="13" letter-spacing="3" fill="#94a3b8">SECURE · VERIFIED · ENCRYPTED</text>
</svg>
